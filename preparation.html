<!DOCTYPE html>
<html lang="bn">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Exam Preparation</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<header>

<div class="navbar">

<a
href="index.html"
class="brand">

🎯 Exam Preparation

</a>

</div>

</header>


<section
class="books-section">

<div
id="preparationList">
</div>

</section>


<script>

const preparations =
JSON.parse(
localStorage.getItem(
"preparations"
)
) || [];


const list =
document.getElementById(
"preparationList"
);


if(
preparations.length === 0
){

list.innerHTML =

`
<div class="empty-message">

<h3>
এখনো কোনো Preparation
পোস্ট করা হয়নি
</h3>

</div>
`;

}


preparations.forEach(item=>{

list.innerHTML += `

<div
class="book-card"
style="
margin-bottom:20px;
">

<div class="book-info">

<h2>
${item.title}
</h2>

<p>
${item.text}
</p>

</div>

</div>

`;

});

</script>

</body>
</html>
